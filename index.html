<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>

<canvas id="c"></canvas>
<div id="bar"><button class="tg" id="qb">やめる</button><button id="act">はじめる</button><button class="tg" id="tb">♪ BGM</button><button class="tg" id="ts">🔥 効果音</button></div>
<script>
const W=360,H=480,cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W*2;cv.height=H*2;ctx.scale(2,2);ctx.imageSmoothingEnabled=false;
const FONT='"DotGothic16","Hiragino Maru Gothic ProN","Yu Gothic UI",Meiryo,sans-serif',$=id=>document.getElementById(id);
try{document.fonts&&document.fonts.load('16px DotGothic16')}catch(e){}
function spr(rows,pal,s){const c=document.createElement('canvas');c.width=rows[0].length*s;c.height=rows.length*s;const g=c.getContext('2d');rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x*s,y*s,s,s)}}));return c}
// 主人公(おいもななのお芋ジャンプのドット絵そのまま、表情だけ差し替え)
const BASE=["................","VV..KKKKKKKK..VV","VVVKBBBBBBBBKVVV","vvKBBBBBBBBBBKvv","vKBBBSBBBBSBBBKv","BKBBSSBBBBSSBBKB","BKBSSSSSSSSSSBKB","BKBSKWSSSSKWSBKB","BKBSKKSSSSKKSBKB",".KBPPSSMMSSPPBK.","..KBSSSSSSSSBK..","...KRRGGGGRRK.K.","..KJKTTRRTTKJKBK","...KQQQQQQQQKBBK","..KQQQWQQWQQQKKK","....KXK..KSK...."];
const PAL={K:'#2a2030',B:'#c6bfc3',S:'#ffe3d0',W:'#fff',R:'#2a2030',P:'#ffb0b8',M:'#e8527a',G:'#b58aff',T:'#fff',Q:'#f2cf5a',V:'#8f4de6',v:'#5b2aa8',J:'#8f55e8',X:'#4a4650',D:'#6b5a5a'};
const ARC=[[7,4,'S'],[7,5,'K'],[7,10,'K'],[7,11,'S'],[8,4,'K'],[8,5,'S'],[8,10,'S'],[8,11,'K']];
const FACE={n:[],hungry:[[10,7,'M'],[10,8,'M']],yum:ARC,gold:ARC.concat([[9,6,'M'],[9,9,'M'],[10,7,'M'],[10,8,'M']]),worry:[[10,6,'M'],[10,9,'M']],

const faces={};function face(m){if(!faces[m]){const r=BASE.map(s=>s.split(''));FACE[m].forEach(([y,x,c])=>r[y][x]=c);faces[m]=spr(r.map(a=>a.join('')),PAL,4)}return faces[m]}
// 芋
const IMO=["..KKKK...",".KYRRRKK.","KYYRRRRRK","KYYRRRRPK",".KRRRRRK.","..KKKKK.."];
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
const CR={raw:{K:'#4a1a3a',R:'#9a4a7a',Y:'#d8b0c8',P:'#c97aa8'},nor:{K:'#5a2a1a',R:'#b8622e',Y:'#f0b050',P:'#d98a4a'},gld:{K:'#b8860b',R:'#ffcf3a',Y:'#fff0a0',P:'#ffe680'},brn:{K:'#2a1008',R:'#7a3418',Y:'#b06a30',P:'#8a4a22'},blk:{K:'#0e0a0a',R:'#2a2220',Y:'#3a302c',P:'#403632'}};
const RK={gold:'gld',nor:'nor',raw:'raw',burn:'blk'};
function drawImo(cx,cy,s,c){const x0=Math.round(cx-4.5*s),y0=Math.round(cy-3*s);IMO.forEach((r,y)=>[...r].forEach((ch,x)=>{if(c[ch]){ctx.fillStyle=c[ch];ctx.fillRect(x0+x*s,y0+y*s,s,s)}}))}
function imoCol(p){const k=ck,st=[[0,CR.raw],[(k.n0+k.gs)/2,CR.nor],[(k.gs+k.ge)/2,CR.gld],[k.be,CR.brn],[1,CR.blk]];
for(let i=1;i<st.length;i++)if(p<=st[i][0]){const a=st[i-1],b=st[i],t=(p-a[0])/(b[0]-a[0]),o={};for(const q in a[1])o[q]=mix(a[1][q],b[1][q],t);return o}return CR.blk}
// 背景(静的)
const bg=document.createElement('canvas');bg.width=W*2;bg.height=H*2;
(function(){const g=bg.getContext('2d');g.scale(2,2);let sd=7;const rn=()=>(sd=(sd*16807)%2147483647)/2147483647,px=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
['#6b4a8a','#a8508a','#d86a7a','#f2876a','#ffa56a','#ffc47a','#ffdb90','#ffe7a8'].forEach((c,i)=>px(0,i*42,W,43,c));
[[110,240,52,'#ffe7a8'],[110,240,40,'#ffd88a']].forEach(([x,y,r,c])=>{g.globalAlpha=.35;for(let dy=-r;dy<=r;dy+=4)for(let dx=-r;dx<=r;dx+=4)if(dx*dx+dy*dy<=r*r)px(x+dx,y+dy,4,4,c);g.globalAlpha=1});
for(let dy=-28;dy<=28;dy+=4)for(let dx=-28;dx<=28;dx+=4)if(dx*dx+dy*dy<=784)px(110+dx,266+dy,4,4,dy<0?'#fffbe0':'#fff1b0');
const cloud=(x,y,w)=>{px(x,y+6,w,8,'#ff9a90');px(x+10,y,w-26,8,'#ffc0a8');px(x+10,y+6,w-26,2,'#ff9a90')};cloud(230,70,90);cloud(20,110,70);cloud(250,150,60);cloud(60,190,100);
for(let x=0;x<W;x+=6){const h=50+Math.sin(x*.03)*14+Math.sin(x*.011)*10;px(x,330-h,6,h,'#c0607a')}
for(let x=0;x<W;x+=6){const h=30+Math.sin(x*.045+2)*10+Math.sin(x*.02)*8;px(x,330-h,6,h,'#8a4a6a')}
const tree=(x,gy,sc,c1,c2)=>{px(x-4*sc,gy-30*sc,8*sc,30*sc,'#4a2a22');[[24,0],[40,1],[52,2],[56,3],[52,4],[40,5],[24,6]].forEach(([w,i])=>{const ww=w*sc;px(x-ww/2,gy-(78-i*8)*sc,ww,8*sc,i<3?c1:c2)})};
tree(36,336,1,'#e8742a','#c8452a');tree(318,334,1.2,'#f2a22a','#d9632a');tree(160,330,.7,'#d9632a','#a83a2a');tree(250,330,.6,'#f2a22a','#d9632a');
px(0,330,W,150,'#7a4a2a');px(0,330,W,10,'#a8662a');px(0,340,W,4,'#8a5a2a');
const LC=['#e8452a','#ff8c2a','#ffc247','#c8452a','#a8662a'];
for(let i=0;i<150;i++)px(Math.round(rn()*W/4)*4,344+Math.round(rn()*34)*4,4,4,i%3?'#6a3e26':LC[i%5]);
for(let r=0;r<11;r++){const w=(11-r)*8+24;for(let x=-w/2;x<w/2;x+=4)px(Math.round(225+x),416+r*4,4,4,LC[Math.floor(rn()*5)])}
})();
// 音
let ac,mst,bgG,seG,mel,nb,fireG,snd={bgm:true,se:true};
try{const o=JSON.parse(localStorage.getItem('yakiimoSnd')||'null');if(o){snd.bgm=o.bgm!==false;snd.se=o.se!==false}}catch(e){}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(d,f,t,dur,ty,v,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(d);o.start(t);o.stop(t+dur+.05)}
function noise(d,t,dur,ft,f,v,q){const s=ac.createBufferSource(),g=ac.createGain(),b=ac.createBiquadFilter();s.buffer=nb;b.type=ft;b.frequency.value=f;b.Q.value=q||1;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(b);b.connect(g);g.connect(d);s.start(t,Math.random()*1.5);s.stop(t+dur+.02)}
const MEL=[[76,0,72,0,69,72,0,0],[77,0,74,0,72,0,69,0],[72,0,76,0,79,0,76,0],[74,0,71,0,67,0,71,74],[76,0,72,0,69,72,76,0],[77,76,74,0,72,0,69,0],[74,0,71,74,79,0,74,0],[72,0,0,0,0,0,0,0]],BAS=[45,41,48,43,45,41,43,48],SPS=.34;
let bN=0,bS=0;
function aInit(){if(ac){ac.resume&&ac.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();
mst=ac.createGain();mst.gain.value=.8;mst.connect(ac.destination);bgG=ac.createGain();bgG.gain.value=snd.bgm?1:0;bgG.connect(mst);seG=ac.createGain();seG.gain.value=snd.se?1:0;seG.connect(mst);
mel=ac.createGain();mel.connect(bgG);const dl=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.54;fb.gain.value=.3;wet.gain.value=.3;mel.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(bgG);
nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const s=ac.createBufferSource(),lp=ac.createBiquadFilter();s.buffer=nb;s.loop=true;lp.type='lowpass';lp.frequency.value=600;fireG=ac.createGain();fireG.gain.value=.05;s.connect(lp);lp.connect(fireG);fireG.connect(seG);s.start();setInterval(tick,60)}
function tick(){const t=ac.currentTime;if(bN<t)bN=t+.05;
while(bN<t+.25){const bar=(bS>>3)&7,k=bS&7,m=MEL[bar][k];if(m)tone(mel,mtof(m),bN,.5,'triangle',.11);if(k==0||k==4)tone(bgG,mtof(BAS[bar]),bN,.9,'sine',.16);bS++;bN+=SPS}
const c=state==='cook';fireG.gain.setTargetAtTime((c?.11:.06)*heat,t,.2);
if(Math.random()<(c?.5:.28)*heat)noise(seG,t+Math.random()*.05,.03+Math.random()*.05,'bandpass',1500+Math.random()*3500,.12+Math.random()*.2,1.5);
if(Math.random()<.08)noise(seG,t,.12,'bandpass',500+Math.random()*500,.2,2)}
function sfxRes(k){if(!ac)return;const t=ac.currentTime;
if(k==='gold')[72,76,79,84,88,91].forEach((m,i)=>tone(seG,mtof(m),t+i*.07,.5,'triangle',.28));
else if(k==='nor')[72,79].forEach((m,i)=>tone(seG,mtof(m),t+i*.1,.3,'triangle',.28));
else if(k==='raw')[57,53].forEach((m,i)=>tone(seG,mtof(m),t+i*.18,.3,'sine',.3));
else{noise(seG,t,.4,'lowpass',1200,.4);[50,46,41].forEach((m,i)=>tone(seG,mtof(m),t+i*.14,.3,'sawtooth',.15))}}
const sfxStart=()=>{if(!ac)return;const t=ac.currentTime;noise(seG,t,.35,'lowpass',900,.5);tone(seG,200,t,.25,'sine',.2,500)};
const sfxPing=()=>{if(ac)tone(seG,mtof(96),ac.currentTime,.25,'sine',.15)};
const sfxSurge=()=>{if(ac)noise(seG,ac.currentTime,.25,'bandpass',1200,.35,1)};
const sfxLand=()=>{if(!ac)return;const t=ac.currentTime;noise(seG,t,.25,'lowpass',700,.5);tone(seG,160,t,.2,'sine',.25,70)};
function ui(){$('tb').classList.toggle('off',!snd.bgm);$('ts').classList.toggle('off',!snd.se)}
function tg(k){aInit();snd[k]=!snd[k];try{localStorage.setItem('yakiimoSnd',JSON.stringify(snd))}catch(e){}ui();if(ac)(k==='bgm'?bgG:seG).gain.setTargetAtTime(snd[k]?1:0,ac.currentTime,.05)}
$('tb').onclick=()=>tg('bgm');$('ts').onclick=()=>tg('se');ui();
// ゲーム
const LIM=45,NM={gold:'黄金の焼き芋!',nor:'普通の焼き芋',raw:'生焼けの芋…',burn:'真っ黒焦げの芋…'},PT={gold:100,nor:30,raw:5,burn:0},BC={gold:'#ffe14d',nor:'#ffb36b',raw:'#d6b8f0',burn:'#b0a5a5'};
const LS=[['ゆっくり じっくり…','まだ かたそう〜'],['いいにおい してきた!','もうすぐ かな…?'],['ほくほく しそう〜♪','あまい かおり!'],['いまだ…!! きんいろ!!','きらきら してる!'],['ちょっと こげくさい…','はやく ぬいてー!'],['けむりが…! あわわ!','まっくろに なる〜!']];
const RL={gold:['ワァ〜! こんがり きんいろ♪','みつが あふれてる〜!!','さいこうの やきいもだ!'],nor:['うん、おいしい やきいも!','ほくほく〜 しあわせ♪'],raw:['うっ…まだ かたい…','なかが つめたいよ〜'],burn:['きゃー! まっくろ こげこげ…','けむり もくもく… ざんねん…']};
const pick=a=>a[Math.random()*a.length|0];
let state='title',tLeft=LIM,score=0,tally,round=0,ck=null,res=null,lock=0,say='',best=0,T=0,parts=[],leaves=[],btxt='',qtxt='',heat=1,fireLv=0,notice=0,qArm=0;
try{best=+localStorage.getItem('yakiimoBest')||0}catch(e){}
for(let i=0;i<14;i++)leaves.push({x:Math.random()*W,y:Math.random()*H,v:.4+Math.random()*.6,ph:Math.random()*6,c:['#e8452a','#ff8c2a','#ffc247','#c8452a'][i%4]});
function start(){fireLv=0;notice=0;heat=1;score=0;tLeft=LIM;round=0;tally={gold:0,nor:0,raw:0,burn:0};res=null;ck=null;state='idle';say='焼くボタンで スタート!'}
function cookStart(){round++;const fl=Math.min(1,(LIM-tLeft)/LIM),gs=.46+Math.random()*.18,gw=.12-.05*fl,bw=.1-.055*fl;ck={p:0,T:7-3.2*fl,fl,ph:Math.random()*6,n0:gs-.2,gs,ge:gs+gw,be:gs+gw+bw,st:-1,th:0,ev:.8,mul:1,sm:1};res=null;state='cook';say='えいっ!';sfxStart()}
const zoneOf=p=>p<ck.n0?0:p<ck.gs?1:p<ck.ge?2:p<ck.be?3:4;
function pull(){if(state!=='cook'||ck.th<.7)return;const z=zoneOf(ck.p),k=['raw','nor','gold','nor','burn'][z];tally[k]++;score+=PT[k];res={k,t:0,line:pick(RL[k])};say=res.line;state='res';lock=.7;sfxRes(k);
if(k==='gold')for(let i=0;i<30;i++){const a=Math.random()*6.28,s=1+Math.random()*3;parts.push({x:225,y:335,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,l:40,c:i%2?'#ffe14d':'#fff'})}}
function over(){state='over';tLeft=0;ck=null;if(score>best){best=score;try{localStorage.setItem('yakiimoBest',best)}catch(e){}}say='じかんぎれ〜!'}
function act(){aInit();if(state==='title'||state==='over')start();else if(state==='idle')cookStart();else if(state==='res'){if(lock<=0)cookStart()}else if(state==='cook')pull()}
$('act').addEventListener('pointerdown',e=>{e.preventDefault();act()});
function quit(){if(state==='over'){state='title';return}if(!(state==='idle'||state==='cook'||state==='res'))return;if(qArm<=0){qArm=2.5;return}qArm=0;if(score>best){best=score;try{localStorage.setItem('yakiimoBest',best)}catch(e){}}state='title';ck=null;res=null;parts=[]}
$('qb').addEventListener('pointerdown',e=>{e.preventDefault();aInit();quit()});
cv.addEventListener('pointerdown',e=>{if(state==='cook'){e.preventDefault();pull()}});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();act()}});
function upd(dt){T+=dt*1000;const play=state==='idle'||state==='cook'||state==='res';
if(play){tLeft-=dt;if(tLeft<=0)over();else{const fl=Math.min(1,(LIM-tLeft)/LIM);heat=1+.8*fl;const lv=1+Math.min(4,Math.floor(fl*5));if(lv>fireLv){if(fireLv){notice=1.8;sfxStart()}fireLv=lv}}}notice=Math.max(0,notice-dt);qArm=Math.max(0,qArm-dt);
if(state==='cook'){if(ck.th<.7){ck.th+=dt;if(ck.th>=.7){ck.th=.7;for(let i=0;i<14;i++)parts.push({x:225,y:420,vx:(Math.random()-.5)*3,vy:-1-Math.random()*2.5,l:40,c:i%2?'#ffc247':'#ff8c2a'});sfxLand()}}else{ck.ev-=dt;if(ck.ev<=0){const r=Math.random();ck.mul=r<.4?2+Math.random()*1.4:r<.7?.3+Math.random()*.3:1;ck.ev=.25+Math.random()*(.7-.3*ck.fl);if(ck.mul>2&&ck.p>.1)sfxSurge()}const sp=ck.mul*(1+ck.fl*.8*ck.p);ck.sm+=(sp-ck.sm)*Math.min(1,dt*14);ck.p+=dt/ck.T*ck.sm;const z=zoneOf(Math.min(ck.p,1)),st=z===0?(ck.p<ck.n0*.5?0:1):z+1;if(st!==ck.st){ck.st=st;say=pick(LS[st]);if(z===2)sfxPing()}if(ck.p>=1){ck.p=1;pull()}}}
if(state==='res'){res.t+=dt;lock-=dt}
if(Math.random()<(state==='cook'?.5:.25))parts.push({x:225+Math.random()*50-25,y:405,vx:Math.random()-.5,vy:-1-Math.random(),l:50,c:Math.random()<.5?'#ffc247':'#ff8c2a'});
parts=parts.filter(p=>(p.x+=p.vx,p.y+=p.vy,p.l--,p.l>0));
leaves.forEach(l=>{l.y+=l.v;l.x+=Math.sin(l.ph+T*.002)*.6+.2;if(l.y>H){l.y=-8;l.x=Math.random()*W}if(l.x>W)l.x=0});
let t='';if(state==='title')t='はじめる';else if(state==='idle')t='焼く 🔥';else if(state==='cook')t=ck.th<.7?'ポイッ!':'引き抜く!';else if(state==='res')t='焼く 🔥';else t='もういちど';
const dis=(state==='res'&&lock>0)||(state==='cook'&&ck.th<.7);if(t!==btxt){btxt=t;$('act').textContent=t}if($('act').disabled!==dis)$('act').disabled=dis;
const qt=qArm>0?'ほんとに?':'やめる';if(qt!==qtxt){qtxt=qt;$('qb').textContent=qt}const qd=state==='title';$('qb').classList.toggle('hl',state==='over');if($('qb').disabled!==qd)$('qb').disabled=qd}
function txt(s,x,y,sz,c,al,st){ctx.font=sz+'px '+FONT;ctx.textAlign=al||'left';ctx.textBaseline='middle';if(st!==false){ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle='#3a1a14';ctx.strokeText(s,x,y)}ctx.fillStyle=c;ctx.fillText(s,x,y)}
function flame(cx,by,k,t,mx){for(let c=-7;c<=7;c++){const a=Math.abs(c),f=.7+.3*Math.sin(t*.011+c*2.1)*Math.sin(t*.023+c*.9+1),h=Math.round(mx*k*(1-a/8.2)*f/4)*4;if(h<4)continue;const x=cx+c*4-2;
[['#e8452a',1,8],['#ff8c2a',.72,7],['#ffd23a',.46,5],['#fff2a8',.22,3]].forEach(([col,r,w])=>{if(a<w){const hh=Math.round(h*r/4)*4;if(hh>=4){ctx.fillStyle=col;ctx.fillRect(x,by-hh,4,hh)}}})}}

function gauge(){const x=292,y=270,w=22,h=170,k=ck,P=p=>y+h-p*h,seg=(a,b,c)=>{ctx.fillStyle=c;ctx.fillRect(x,Math.round(P(b)),w,Math.round(P(a))-Math.round(P(b)))};
ctx.fillStyle='#3a1a14';ctx.fillRect(x-4,y-4,w+8,h+8);seg(0,k.n0,'#c7b6d6');seg(k.n0,k.gs,'#f0a040');seg(k.gs,k.ge,'#ffd93a');seg(k.ge,k.be,'#d97a2a');seg(k.be,1,'#4a3030');
if(Math.sin(T*.012)>0){ctx.fillStyle='#fff7b0';ctx.fillRect(x,Math.round(P(k.ge)),w,2);ctx.fillRect(x,Math.round(P(k.gs))-2,w,2)}
[['なま',0,k.n0],['ふつう',k.n0,k.gs],['黄金',k.gs,k.ge],['ふつう',k.ge,k.be],['こげ',k.be,1]].forEach(([s,a,b])=>txt(s,x+w+8,(P(a)+P(b))/2,s==='黄金'?12:10,s==='黄金'?'#ffe14d':'#ffe9c4','left',false));
const my=Math.round(P(k.p));ctx.fillStyle='#fff';ctx.fillRect(x-8,my-2,w+16,4);ctx.fillStyle='#3a1a14';ctx.fillRect(x-8,my-4,4,8);ctx.fillRect(x+w+4,my-4,4,8)}
function draw(){ctx.drawImage(bg,0,0,W,H);
leaves.forEach(l=>{ctx.fillStyle=l.c;ctx.fillRect(Math.round(l.x/2)*2,Math.round(l.y/2)*2,4,3)});
let m='n';if(state==='cook'){const z=zoneOf(ck.p);m=['n','yum','gold','worry','burnt'][z];if(z===0&&ck.p>=ck.n0*.5)m='hungry';if(ck.th<.7)m='yum'}else if(state==='res')m={gold:'gold',nor:'yum',raw:'worry',burn:'burnt'}[res.k];else if(state==='title'||state==='over')m=state==='title'?'yum':'n';
const jump=m==='gold'?Math.abs(Math.sin(T*.012))*8:m==='burnt'?Math.sin(T*.05)*2:Math.sin(T*.005)*2;
if(state!=='title')ctx.drawImage(face(m),40,Math.round(398-jump));
const k=(state==='cook'?1.1+(ck.th>=.7?Math.min(.6,.15*(ck.sm-1)):0):1)*heat;flame(225,440,k,T,72);
// 芋
if(state==='cook'){if(ck.th<.7){const u=ck.th/.7;drawImo(96+129*u,414+10*u-70*Math.sin(Math.PI*u),4,CR.raw)}else{const c=imoCol(ck.p),j=ck.p>ck.be?Math.sin(T*.06)*1.5:0;drawImo(225+j,424,4,c)}}
flame(225,436,k*.45,T+300,44);
parts.forEach(p=>{ctx.globalAlpha=Math.min(1,p.l/30);ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),3,3)});ctx.globalAlpha=1;
if(state==='res'){const b=Math.abs(Math.sin(res.t*7))*Math.max(0,1-res.t*1.6)*30;drawImo(225,332-b,5,CR[RK[res.k]]);
if(res.k==='gold')for(let i=0;i<6;i++){const a=T*.003+i*1.05,x=225+Math.cos(a)*50,y=332+Math.sin(a)*30;ctx.globalAlpha=.5+.5*Math.sin(T*.01+i);ctx.fillStyle='#fff7b0';ctx.fillRect(x-2,y-6,4,12);ctx.fillRect(x-6,y-2,12,4);ctx.globalAlpha=1}
if(res.t<2.4){ctx.globalAlpha=Math.min(1,(2.4-res.t)*2);txt(NM[res.k],W/2,170,26,BC[res.k],'center');txt('+'+PT[res.k],W/2,202,20,'#fff','center');ctx.globalAlpha=1}}
if(state==='cook'&&ck.th>=.7)gauge();
if(notice>0){ctx.globalAlpha=Math.min(1,notice*1.5);txt('火が 強くなった!!',W/2,250,22,'#ff8a3a','center');ctx.globalAlpha=1}
if(state!=='title'&&say)bubble(say);
if(state!=='title'){txt('SCORE '+score,8,16,14,'#fff','left');txt('火力 '+'★'.repeat(fireLv),W/2,16,12,'#ffb36b','center');const tl=Math.max(0,tLeft);txt('のこり '+Math.ceil(tl),W-8,16,14,tl>10?'#fff':'#ff8a6a','right');
ctx.fillStyle='#3a1a14';ctx.fillRect(6,28,W-12,10);ctx.fillStyle=tl>10?'#ffd23a':'#ff5a3a';ctx.fillRect(8,30,Math.round((W-16)*tl/LIM),6);
['gold','nor','raw','burn'].forEach((q,i)=>{drawImo(22+i*88,56,2,CR[RK[q]]);txt('x'+tally[q],36+i*88,56,13,'#fff','left')})}
if(state==='title'){ctx.fillStyle='rgba(40,16,24,.55)';ctx.fillRect(0,0,W,H);ctx.drawImage(face('yum'),148,226-Math.abs(Math.sin(T*.006))*6);
txt('黄金の焼き芋名人',W/2,110,32,'#ffe14d','center');txt('落ち葉の焚き火で 芋を焼こう!',W/2,152,14,'#fff','center');
['焼くボタンで 芋を焼きはじめ','ゲージの 黄金ゾーンで','引き抜けば 黄金の焼き芋!','制限時間は 45秒','後半は 火が強くなるよ…!'].forEach((s,i)=>txt(s,W/2,320+i*24,14,'#ffe9c4','center'));if(best)txt('ベスト '+best,W/2,430,14,'#ffc247','center')}
if(state==='over'){ctx.fillStyle='rgba(40,16,24,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#5a3a22';ctx.fillRect(26,96,308,290);ctx.fillStyle='#fff0d0';ctx.fillRect(30,100,300,282);
txt('じかんぎれ!',W/2,134,28,'#e8452a','center');txt('スコア '+score,W/2,172,22,'#4a2a1a','center',false);
[['gold','黄金の焼き芋'],['nor','普通の焼き芋'],['raw','生焼けの芋'],['burn','真っ黒焦げの芋']].forEach(([q,n],i)=>{drawImo(66,208+i*28,3,CR[RK[q]]);txt(n,92,208+i*28,15,'#4a2a1a','left',false);txt('x '+tally[q],316,208+i*28,15,'#4a2a1a','right',false)});
const rk=score>=500?'やきいも伝説!!':score>=300?'やきいも名人!':score>=150?'一人前の焼き芋屋さん':'みならい中…';
txt(rk,W/2,334,18,'#c8452a','center',false);txt('ベスト '+best,W/2,362,14,'#7a5a3a','center',false)}}
let last=performance.now();
function loop(n){const dt=Math.min(.1,(n-last)/1000);last=n;upd(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
